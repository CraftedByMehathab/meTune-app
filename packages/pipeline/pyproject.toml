[project]
name = "metune-pipeline"
version = "0.1.0"
description = "meTune hybrid analysis pipeline: DSP rules + audio LLM"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pydantic>=2.5",
    "onnxruntime>=1.17",
    "google-genai>=1.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.scripts]
metune = "metune_pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/metune_pipeline"]
