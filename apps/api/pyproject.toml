[project]
name = "metune-api"
version = "0.1.0"
description = "meTune web API: auth, batch upload, worker, results"
requires-python = ">=3.11,<3.13"
dependencies = [
    "metune-pipeline",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "pwdlib[argon2]>=0.2",
    "itsdangerous>=2.2",
    "python-multipart>=0.0.18",
    "scikit-learn>=1.5",
]

[tool.uv.sources]
metune-pipeline = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/metune_api"]
