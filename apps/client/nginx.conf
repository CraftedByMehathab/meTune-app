server {
  listen 80;
  root /usr/share/nginx/html;

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # SPA fallback: React Router owns every non-file path
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
