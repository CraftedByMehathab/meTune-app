# meTune pipeline config. Every threshold lives here; its hash is stored on each batch.
# Rationale for each value: meTune vault → DR-006 (DSP fields), DR-003 (LLM), Cost Model.

sample_rate: 16000
frame_ms: 20                 # DSP frame size
skip_start_s: 1.0            # mask connect tone (~440 Hz) at call start
edge_ignore_s: 2.0           # ignore silence at very start/end
long_silence_s: 10.0         # 7.3 s gap was labeled "no long silence"
vad_threshold: 0.5
clip_pct_slight: 0.5         # % clipped samples → slightly_impaired
clip_pct_severe: 3.0         # → severely_impaired
spike_jump_db: 25.0          # energy jump in one frame = click/static
spike_rate_static: 20.0      # spikes/min → "static"; also fills in noise when the LLM hears none
default_vote_confidence: 0.4 # cap when every vote is the all-defaults answer (neutral, no noise, no overlap)

tone_source: llm                      # E35: Gemini reads tone from words + voice; on MELD (natural speech) macro F1 0.38 vs SER bag 0.19. ser = speech-emotion models (DR-020; win on acted CREMA-D only)
ser_models:                           # E20 bag: 5 fine-tuned wav2vec2 (actor bootstrap), 8-bit ONNX, mean of probs
  - .data/models/ser_e20_bag1.int8.onnx   # 122 MB each, not in git: eval/export_ser_onnx.py
  - .data/models/ser_e20_bag2.int8.onnx
  - .data/models/ser_e20_bag3.int8.onnx
  - .data/models/ser_e20_bag4.int8.onnx
  - .data/models/ser_e20_bag5.int8.onnx
ser_top_fraction: 1.0                 # tuned on val_big for the bag: mean over all speech windows
ser_tau: 0.4                          # neutral unless 1 - p(neutral) >= tau (tuned on val_big_agent, E21)
ser_customer_only: true               # E21: score phone-line (narrowband) windows only; the agent's VoIP leg is wideband
ser_narrowband_max: 1.0e-4            # high-band share below this = customer (trial calls: <1e-4 vs agent 1e-2.5+)
ser_bias: {neutral: 0.0, satisfied: 1.1, frustrated: 1.0, upset: -1.1, distressed: 1.7}   # E33: replaces ser_tau; test macro F1 0.50 → 0.61

noise_source: ast                     # ast = AudioSet classifier + trained head owns noise (E25: test_big acc 0.88 vs 3.8 Flash 0.74); llm = Gemini
noise_model: .data/models/ast_audioset.int8.onnx   # 92 MB, not in git: eval/export_ast_onnx.py; head: metune_pipeline/models/noise_head.json

overlap_detector: true                # E31: pyannote (vendored, 6 MB) OR the LLM; test recall 0.40 → 0.68, precision 0.90
overlap_frame_p: 0.4                  # p(two speakers) per frame; with overlap_min_s picked on val_big_agent_ovl
overlap_min_s: 0.42

llm_model: gemini-3.8-flash           # E26: best Gemini on noise/overlap/intensity; was gemini-3.5-flash-lite
llm_prompt: v2                        # v1 labels-only · v2 describe-then-label · v3 v2 + judge the voice, not the words (DR-017)
llm_votes: 1                          # E22: k=1 ≈ k=3 on every field; tone comes from the SER bag, so no tone ties to break
llm_temperatures: [0.0]               # one per vote (cycled), so votes aren't duplicates
llm_thinking_level: low               # 3.8 Flash rejects "minimal" (HTTP 400); thinking tokens bill as output
llm_timeout_s: 120
llm_rpm: 300                          # request cap per process (DR-018). Paid tier since 2026-10-27; free tier = 14. 0 = none
llm_retries: 2
llm_confidence: true                  # E36: confidence = how often Gemini's tone was right on MELD dev (test ECE 0.044)

# USD per 1M tokens, ai.google.dev/gemini-api/docs/pricing (checked 2026-10-28; 3.8 Flash price until 2026-12-31)
# no separate audio rate listed for 3.8 Flash → billed at the input rate (assumption)
price_per_1m:
  audio_in: 0.75
  text_in: 0.75
  text_out: 3.75
